name: Iris API CI/CD

# WHEN should the pipeline run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

jobs:
  # ---------- Stage 1: CI - does the code and the model still work? ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Train model (fails if accuracy < 0.90)
        run: python train.py

      - name: Run tests
        run: pytest -v

  # ---------- Stage 2: CI - does the Docker image build and answer? ----------
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t iris-api:ci .

      - name: Start the container and smoke-test it
        run: |
          docker run -d -p 5000:5000 --name iris iris-api:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && break
            sleep 1
          done
          curl -sf -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}' \
            | tee result.json
          grep -q setosa result.json

      - name: Show container logs if something failed
        if: failure()
        run: docker logs iris

  # ---------- Stage 3: CD - publish the image (only for pushes to main) ----------
  deliver:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/iris-api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
